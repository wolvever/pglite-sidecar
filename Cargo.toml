[package]
name = "pglite-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Embed PostgreSQL via pglite-rs and expose it over a Unix socket"
license = "MIT"
repository = "https://github.com/wolvever/pglite-sidecar"
readme = "README.md"
keywords = ["postgres", "postgresql", "pglite", "embedded", "sidecar"]
categories = ["database", "command-line-utilities"]
publish = false

[[bin]]
name = "pglite-sidecar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pglite-rs = { version = "0.2.7", features = ["socket", "multiple-process"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
